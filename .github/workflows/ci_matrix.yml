name: Checking app
on:   
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  run_tests:
    strategy:
      matrix:
        service: [tasks-api, title-normalizer]
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install -r services/${{ matrix.service }}/requirements.txt
    - name: Run tests
      run: python -m pytest -r services/${{ matrix.service }}