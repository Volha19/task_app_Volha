name: Checking app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/tasks-api/requirements.txt
          python -m pip install -r services/title-normalizer/requirements.txt
      - name: Test tasks API
        run: python -m pytest
        working-directory: services/tasks-api
      - name: Test title normalizer
        run: python -m pytest
        working-directory: services/title-normalizer