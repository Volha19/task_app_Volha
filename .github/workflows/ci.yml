name: Checking app
on:   
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/setup-python@v7
      with: 
          python-version: '3.12'
    - run: | 
        can python -m pip install --upgrade pip
            pip install -r services/tasks-api/requirements.txt
            pip install -r services/title-normalizer/requirements.txt
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7